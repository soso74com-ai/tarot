<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별의 서재 | Tarot Reading</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap');
:root{--bg:#090b1d;--panel:#11152d;--gold:#d8bd82;--muted:#a9a5bd;--cream:#f4ead7;--line:rgba(216,189,130,.25)}
*{box-sizing:border-box}body{margin:0;color:var(--cream);background:radial-gradient(ellipse at 50% -20%,#33305d 0%,#151833 38%,var(--bg) 76%);font-family:'Noto Serif KR',serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(1px 1px at 12% 20%,#fff 99%,transparent),radial-gradient(1px 1px at 78% 34%,#fff 99%,transparent),radial-gradient(2px 2px at 45% 70%,#e6d6a9 99%,transparent),radial-gradient(1px 1px at 90% 82%,#fff 99%,transparent),radial-gradient(1px 1px at 25% 88%,#fff 99%,transparent);background-size:230px 190px}
header{text-align:center;padding:48px 18px 25px;position:relative} .eyebrow{letter-spacing:.35em;color:var(--gold);font-size:11px}
h1{font-family:'Cormorant Garamond','Noto Serif KR',serif;font-size:clamp(42px,7vw,68px);font-weight:600;letter-spacing:.08em;margin:9px 0 4px;color:#f5e8c9}
.subtitle{color:var(--muted);font-size:13px;letter-spacing:.08em}
main{max-width:1050px;margin:auto;padding:0 20px 70px;position:relative}
.panel{background:linear-gradient(145deg,rgba(25,29,59,.92),rgba(13,16,37,.94));border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 18px 60px #0005;margin:18px 0}
h2{font-size:17px;font-weight:500;color:var(--gold);margin:0 0 17px;letter-spacing:.06em}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:7px}
select,input{width:100%;background:#090d23;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:13px;outline:none}
.question{margin-top:14px}
button{border:0;cursor:pointer;font-family:inherit;transition:.2s}
.primary{width:100%;margin-top:17px;padding:14px;border-radius:12px;background:linear-gradient(100deg,#b99b62,#e4d1a2,#b99b62);color:#17152a;font-weight:700;letter-spacing:.08em}
.primary:hover{filter:brightness(1.1);transform:translateY(-1px)}
.secondary{background:transparent;border:1px solid var(--line);color:var(--gold);padding:9px 14px;border-radius:10px;font-size:12px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
.cards{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px 0 4px}
.tarot-card{width:clamp(112px,17vw,154px);height:245px;perspective:1000px;cursor:pointer;flex:0 0 auto}
.tarot-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.7,.2,1)}
.tarot-card.revealed .tarot-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid #c5a96e;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#151a3b 0 7px,#1c2146 7px 14px);box-shadow:inset 0 0 0 4px #151a3b,inset 0 0 0 5px #c5a96e}
.back:before{content:"✧";font-size:70px;color:#d9c18b;text-shadow:0 0 22px #d9c18b;position:absolute;top:68px}
.back:after{content:"✦  ✧  ✦";position:absolute;bottom:24px;color:#d9c18b;letter-spacing:8px;font-size:12px}
.front{transform:rotateY(180deg);background:linear-gradient(160deg,#f5e9d1,#d9c69f);color:#29213a;box-shadow:inset 0 0 0 4px #e9d8b7}
.card-number{font-family:'Cormorant Garamond',serif;font-size:12px;letter-spacing:.12em}
.symbol{font-size:61px;line-height:1;text-shadow:0 3px 0 #b89b6d;margin:auto}
.card-name{font-size:13px;font-weight:700;text-align:center;line-height:1.5}
.card-sub{font-size:9px;letter-spacing:.12em;text-align:center}
.position{font-size:11px;color:var(--gold);margin-top:6px;text-align:center}
.tarot-card.reversed .front .symbol{transform:rotate(180deg)}
.readings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
.reading{border:1px solid var(--line);background:#0b1027aa;border-radius:14px;padding:15px}
.reading h3{font-size:14px;color:var(--gold);margin:0 0 7px}
.reading .meta{font-size:11px;color:#c2b9a5;margin-bottom:8px}
.reading p{font-size:12px;line-height:1.9;color:#ddd5c7;margin:0}
.empty{text-align:center;padding:36px 10px;color:var(--muted);font-size:13px;line-height:2}
.foot{text-align:center;color:#77758e;font-size:10px;padding:12px 0 35px;line-height:1.8}
.hidden{display:none!important}
@media(max-width:600px){header{padding-top:34px}.panel{padding:18px}.controls{grid-template-columns:1fr}.tarot-card{height:205px;width:112px}.symbol{font-size:48px}}
</style>
</head>
<body>
<header>
 <div class="eyebrow">✦ THE CELESTIAL TAROT ✦</div>
 <h1>별의 서재</h1>
 <div class="subtitle">마음속 질문을 떠올리고, 오늘의 카드를 만나보세요</div>
</header>
<main>
 <section class="panel">
  <h2>✧ 오늘의 리딩 준비</h2>
  <div class="controls">
   <div><label for="spread">카드 배열 선택</label>
    <select id="spread">
     <option value="1">한 장 리딩 · 지금 필요한 메시지</option>
     <option value="3" selected>세 장 리딩 · 과거 / 현재 / 미래</option>
     <option value="5">다섯 장 리딩 · 상황의 흐름</option>
     <option value="10">켈틱 크로스 · 깊이 있는 종합 리딩</option>
    </select>
   </div>
   <div><label for="mode">카드 방향</label>
    <select id="mode"><option value="both">정방향과 역방향 모두</option><option value="up">정방향만</option></select>
   </div>
  </div>
  <div class="question"><label for="question">마음속 질문 (선택)</label><input id="question" maxlength="100" placeholder="예: 지금 나에게 필요한 조언은 무엇일까?"></div>
  <button class="primary" id="draw">카드 섞고 뽑기 ✦</button>
  <p class="hint">카드를 뽑은 뒤 각 카드를 눌러 앞면을 공개하세요. 카드는 매번 새롭게 섞입니다.</p>
 </section>
 <section class="panel">
  <div class="section-head"><h2>✧ 당신에게 도착한 카드</h2><button class="secondary hidden" id="reset">다시 뽑기</button></div>
  <div id="cards" class="cards"><div class="empty">아직 뽑힌 카드가 없어요.<br>마음속 질문을 떠올린 뒤 카드를 뽑아보세요.</div></div>
  <div id="readings" class="readings"></div>
 </section>
 <div class="foot">TAROT IS A MIRROR, NOT A FIXED DESTINY.<br>타로는 미래를 확정하는 예언이 아니라, 자신을 돌아보는 하나의 도구입니다.</div>
</main>
<script>
const majors = [
["바보","The Fool","🧳","새로운 시작, 자유, 가능성","충동, 준비 부족, 망설임","익숙한 틀을 벗어나 새로운 경험을 시작할 기회입니다. 완벽한 준비보다 열린 마음이 중요할 수 있어요.","시작을 서두르기보다 상황을 살피고 준비할 필요가 있습니다. 두려움 때문에 가능성을 닫고 있지는 않은지도 돌아보세요."],
["마법사","The Magician","🪄","창조력, 실행력, 집중","자원 낭비, 자신감 부족, 속임수","이미 가진 능력과 자원을 활용할 때입니다. 생각에 머무르지 말고 작은 행동으로 옮겨보세요.","능력을 충분히 활용하지 못하거나 목표가 흐려졌을 수 있습니다. 말보다 실제 행동과 진정성을 살펴보세요."],
["여사제","The High Priestess","🌙","직관, 지혜, 내면","비밀, 혼란, 직관의 외면","서두르지 말고 내면의 목소리에 귀 기울이세요. 아직 드러나지 않은 정보가 있을 수 있습니다.","감정과 사실을 구분하고, 모호한 상황을 혼자 추측하기보다 확인하는 태도가 필요합니다."],
["여황제","The Empress","🌿","풍요, 돌봄, 성장","과잉보호, 정체, 자기 돌봄 부족","관계와 계획이 풍성하게 자라날 수 있는 시기입니다. 자신과 주변을 따뜻하게 돌보세요.","다른 사람을 챙기느라 자신을 소홀히 하고 있지는 않나요? 균형과 휴식이 필요합니다."],
["황제","The Emperor","👑","질서, 책임, 안정","경직, 통제, 완고함","명확한 기준과 계획이 상황을 안정시킵니다. 책임감 있게 중심을 잡아보세요.","규칙이나 통제가 지나치게 강해졌을 수 있습니다. 유연하게 의견을 듣고 조정해 보세요."],
["교황","The Hierophant","📜","전통, 배움, 조언","관습에 대한 반발, 독자적 사고","검증된 지식과 경험에서 도움을 얻을 수 있습니다. 믿을 만한 조언자에게 배우는 것도 좋습니다.","남들이 정한 기준을 무조건 따르고 있지는 않은지 살펴보세요. 자신에게 맞는 방식을 고민할 때입니다."],
["연인","The Lovers","💞","선택, 조화, 관계","불일치, 갈등, 선택 회피","중요한 선택 앞에서 자신의 가치관을 확인하세요. 솔직한 소통이 관계를 깊게 합니다.","마음과 행동이 어긋나거나 가치관의 차이가 드러날 수 있습니다. 회피하지 말고 차분히 대화하세요."],
["전차","The Chariot","🏇","의지, 추진력, 승리","방향 상실, 조급함, 통제 부족","목표를 분명히 하고 집중하면 앞으로 나아갈 수 있습니다. 서로 다른 마음을 한 방향으로 모아보세요.","속도보다 방향을 점검하세요. 무리하게 밀어붙이기보다 계획을 다시 정돈할 필요가 있습니다."],
["힘","Strength","🦁","용기, 인내, 부드러운 통제","자신감 저하, 감정 억압","진정한 강함은 차분함과 인내에서 나옵니다. 자신과 타인을 부드럽게 대하세요.","자신을 지나치게 몰아붙이고 있지는 않나요? 감정을 인정하고 작은 자신감부터 회복해 보세요."],

["운명의 수레바퀴","Wheel of Fortune","☸️","변화, 전환점, 흐름","변화에 대한 저항, 불안정","상황의 흐름이 바뀌는 전환점일 수 있습니다. 변화에 열린 태도로 기회를 살펴보세요.","뜻대로 되지 않는 흐름을 억지로 통제하기보다 지금 조정할 수 있는 부분에 집중하세요."],
["정의","Justice","⚖️","공정, 균형, 책임","편견, 불균형, 책임 회피","사실을 객관적으로 살피고 선택의 결과를 책임지는 것이 중요합니다.","한쪽 입장에 치우치지 않았는지 점검하세요. 불공정한 부분이 있다면 바로잡을 방법을 찾으세요."],
["매달린 사람","The Hanged Man","🪢","관점 전환, 기다림, 내려놓음","정체, 희생의 강요, 미련","잠시 멈추면 이전과 다른 해결책이 보일 수 있습니다. 관점을 바꿔 바라보세요.","의미 없는 기다림이나 일방적인 희생을 반복하고 있지는 않은지 살펴보세요."],
["죽음","Death","🦋","종결, 변화, 새로운 단계","변화 거부, 미련, 정체","한 단계가 마무리되고 새로운 흐름이 시작될 수 있습니다. 끝맺음은 다음 시작의 일부입니다.","이미 끝난 일을 붙잡고 있지는 않나요? 변화에 필요한 정리를 차근차근 해보세요."],
["절제","Temperance","🏺","조화, 회복, 균형","극단, 불균형, 조급함","서로 다른 요소를 조화롭게 섞는 지혜가 필요합니다. 천천히 균형을 찾아가세요.","한쪽으로 치우친 생활이나 관계를 조정하세요. 작은 습관의 변화가 도움이 됩니다."],
["악마","The Devil","⛓️","집착, 유혹, 속박의 인식","속박에서 벗어남, 집착 완화","나를 붙잡는 습관이나 관계가 무엇인지 솔직하게 바라볼 때입니다.","스스로를 제한하던 패턴에서 벗어날 가능성이 있습니다. 건강한 선택을 이어가세요."],
["탑","The Tower","⚡","급격한 변화, 깨달음, 붕괴","변화의 지연, 불안, 재정비","기존의 믿음이나 계획을 다시 보게 되는 변화가 있을 수 있습니다. 사실을 바탕으로 새롭게 세우세요.","필요한 변화를 미루고 있지는 않나요? 불안을 줄이기 위해 현실적인 대비를 시작하세요."],

["달","The Moon","🌕","불확실성, 상상, 잠재의식","혼란 해소, 진실의 드러남","모든 것이 분명하지 않을 수 있습니다. 추측보다 확인을 우선하고 감정을 살펴보세요.","막연했던 불안의 원인이 드러날 수 있습니다. 사실을 하나씩 확인하며 판단하세요."],
["태양","The Sun","☀️","활력, 성공, 명료함","지연된 기쁨, 과한 낙관","자신감을 갖고 밝게 표현해 보세요. 노력의 성과와 즐거움을 누릴 수 있는 때입니다.","기대가 현실보다 앞서 있지는 않은지 점검하세요. 작은 성취도 충분히 기뻐해도 좋습니다."],
["심판","Judgement","📯","각성, 재평가, 부름","자기 의심, 후회, 판단 유보","과거의 경험을 돌아보고 다음 단계로 나아갈 때입니다. 스스로에게 중요한 선택을 내려보세요.","후회나 자기비판에 머물지 말고 배운 점을 정리해 새로운 결정을 준비하세요."],
["세계","The World","🌍","완성, 성취, 통합","마무리 지연, 미완성, 정체","하나의 과정이 결실을 맺는 흐름입니다. 성취를 인정하고 다음 목표를 준비하세요.","마무리하지 못한 일이 남아 있을 수 있습니다. 마지막 단계를 구체적으로 정리해 보세요."]

let drawn=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){
 const count=Number($("spread").value),allowRev=$("mode").value==="both";
 drawn=shuffle([...cards]).slice(0,count).map(c=>({...c,reversed:allowRev&&Math.random()<.35}));
 $("cards").innerHTML="";$("readings").innerHTML="";$("reset").classList.remove("hidden");
 drawn.forEach((c,i)=>{
  const el=document.createElement("div");el.className="tarot-card"+(c.reversed?" reversed":"");el.setAttribute("role","button");el.setAttribute("tabindex","0");el.setAttribute("aria-label",positions[count][i]+" 카드 공개하기");
  el.innerHTML=`<div class="tarot-inner"><div class="face back"><div class="card-sub">✦ THE CELESTIAL TAROT ✦</div><div class="card-number">✧</div><div class="card-sub">REVEAL YOUR CARD</div></div><div class="face front"><div class="card-number">${c.num}</div><div class="symbol">${c.symbol}</div><div class="card-name">${c.name}</div><div class="card-sub">${c.en}</div></div></div><div class="position">${positions[count][i]}</div>`;
  const reveal=()=>{el.classList.add("revealed");showReading(i)};
  el.addEventListener("click",reveal);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal()}});
  $("cards").appendChild(el);
 });
}
function showReading(i){
 const c=drawn[i],count=drawn.length;
 if($("reading-"+i))return;
 const box=document.createElement("article");box.className="reading";box.id="reading-"+i;
 const direction=c.reversed?"역방향":"정방향";
 const meaning=c.reversed?c.rev:c.up;
 const detail=c.reversed?c.revText:c.upText;
 const q=$("question").value.trim();
 box.innerHTML=`<h3>${positions[count][i]} · ${c.name}</h3><div class="meta">${c.en}　|　${direction}</div><p><b>핵심 키워드</b><br>${meaning}</p><p style="margin-top:9px">${detail}</p>`;
 $("readings").appendChild(box);
}
